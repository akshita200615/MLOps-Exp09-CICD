name: ML CI Pipeline

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:
  test-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn joblib pytest

      - name: Run automated tests
        working-directory: ai_ci_cd_project
        run: pytest -v

      - name: Run model training pipeline
        working-directory: ai_ci_cd_project
        run: python train.py
